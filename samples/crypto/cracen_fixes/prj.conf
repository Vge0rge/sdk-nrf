CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_CONSOLE=y
CONFIG_LOG=y

# Enable cryptographic features
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_SRP_6=y
CONFIG_PSA_WANT_ALG_SRP_PASSWORD_HASH=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_KEY_PAIR_IMPORT=y
