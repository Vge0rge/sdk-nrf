CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_CONSOLE=y
CONFIG_LOG=y

# Enable cryptographic features
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_SRP_6=y
CONFIG_PSA_WANT_ALG_SRP_PASSWORD_HASH=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_KEY_PAIR_IMPORT=y

# H-02: AES-CCM single-part decrypt
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y

# H-02 overflows a stack buffer on an affected build. Canaries turn that into a deterministic
# fatal error instead of silent corruption, so CI reports a failure rather than a flaky pass.
# STACK_CANARIES depends on ENTROPY_GENERATOR, and is silently dropped without it.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_STACK_CANARIES=y
