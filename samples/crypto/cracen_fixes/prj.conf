CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_CONSOLE=y
CONFIG_LOG=y

# Enable cryptographic features
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_SRP_6=y
CONFIG_PSA_WANT_ALG_SRP_PASSWORD_HASH=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_SRP_KEY_PAIR_IMPORT=y

# H-02: AES-CCM single-part decrypt
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y

# H-2 reuses the SRP public key type already enabled above, because this build has no
# unstructured-key import path: cracen_import_key() has no branch for HMAC or raw data, and
# PSA_NEED_OBERON_KEY_MANAGEMENT_DRIVER is undefined, so those imports return NOT_SUPPORTED.

# Flush each line as it is logged, so nothing is lost if a test faults
CONFIG_LOG_MODE_IMMEDIATE=y

# H-02 overflows a stack buffer on an affected build. Canaries turn that into a deterministic
# fatal error instead of silent corruption, so CI reports a failure rather than a flaky pass.
# STACK_CANARIES depends on ENTROPY_GENERATOR, and is silently dropped without it.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_STACK_CANARIES=y

# H-2: an RSA key pair is the only importable key material over 524 bytes here
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_SHA_256=y
