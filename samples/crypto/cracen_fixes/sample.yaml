sample:
  description: |
    Regression tests for two CRACEN findings. C-01: an SRP-6a peer public value that is
    0 mod N must be rejected, and a legitimate handshake must still complete. H-02: AES-CCM
    single-part decrypt must reject an oversized AEAD tag length instead of copying it into
    a 16-byte stack buffer. H-02 only reaches the affected code on builds with
    CONFIG_PSA_NEED_CRACEN_MULTIPART_WORKAROUNDS, i.e. nRF54LM20A/B.
  name: CRACEN fixes

common:
  sysbuild: true
  tags:
    - psa
    - cracen
    - crypto
    - ci_samples_crypto
  harness: console
  harness_config:
    type: multi_line
    regex:
      - ".*C-01 SRP zero public value test passed.*"
      - ".*Example finished successfully!.*"

tests:
  sample.cracen_fixes.cracen:
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp/ns
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
  sample.cracen_fixes.cracen.crypto_service:
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
